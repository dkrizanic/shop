services:
  - type: web
    name: shop-fullstack
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: JwtSettings__SecretKey
        generateValue: true  # This will generate a secure random value
      - key: JwtSettings__Issuer
        value: ShopAPI
      - key: JwtSettings__Audience
        value: ShopAPIUsers
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/tmp/shop.db
      - key: FRONTEND_URL
        value: https://shop-kkpi.onrender.com